name: Service architecture validation

on:
  push:
    branches: [master, codex/service-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launchd-service:
    name: Real launchd migration and lifecycle
    runs-on: macos-14
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Verify migration, cold recovery, and lifecycle on real launchd
        env:
          ONEBOTS_LAUNCHD_ACCEPTANCE: "1"
        run: node scripts/verify-launchd-service-lifecycle.mjs

  system-service:
    name: Real systemd migration and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Verify migration, cold recovery, and lifecycle on real systemd
        run: |
          sudo env \
            "PATH=$PATH" \
            "CI=$CI" \
            "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN" \
            ONEBOTS_SYSTEMD_ACCEPTANCE=1 \
            "$(command -v node)" scripts/verify-system-service-lifecycle.mjs

  windows-host:
    name: Windows native host foundation
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/windows-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: native/windows-host/go.sum
      - name: Test Windows host, pipe ACL, and remote rejection
        run: go test ./...
      - name: Build Windows host executable
        run: go build ./cmd/onebots-windows-host

  interop:
    name: Framework interop (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: node
          - group: python-light
            python: "3.13"
          - group: python-heavy
            python: "3.12"
          - group: native
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        if: startsWith(matrix.group, 'python')
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm interop:control:guard
      - name: Install Node framework fixtures
        if: matrix.group == 'node'
        run: |
          for framework in zhin alemonjs karin koishi kotori; do
            npm ci --prefix "interop/$framework" --ignore-scripts
          done
      - name: Verify Node frameworks
        if: matrix.group == 'node'
        run: |
          for framework in zhin alemonjs karin koishi kotori; do
            pnpm "interop:$framework"
          done
      - name: Install light Python framework fixtures
        if: matrix.group == 'python-light'
        run: |
          python -m pip install -r interop/nonebot/requirements.txt
          python -m venv interop/melobot/.venv
          interop/melobot/.venv/bin/pip install -r interop/melobot/requirements.txt
          python -m venv interop/alicebot/.venv
          interop/alicebot/.venv/bin/pip install -r interop/alicebot/requirements-source.txt -r interop/alicebot/requirements.txt
      - name: Verify light Python frameworks
        if: matrix.group == 'python-light'
        env:
          ONEBOTS_INTEROP_PYTHON: python
        run: |
          pnpm interop:nonebot
          pnpm interop:melobot
          pnpm interop:alicebot
      - name: Install heavy Python framework fixtures
        if: matrix.group == 'python-heavy'
        run: |
          for framework in astrbot langbot; do
            python -m venv "interop/$framework/.venv"
            "interop/$framework/.venv/bin/pip" install -r "interop/$framework/requirements-source.txt" -r "interop/$framework/requirements.txt"
          done
      - name: Verify heavy Python frameworks
        if: matrix.group == 'python-heavy'
        run: |
          pnpm interop:astrbot
          pnpm interop:langbot
      - name: Verify native frameworks
        if: matrix.group == 'native'
        run: |
          pnpm interop:zerobot
          pnpm interop:kovi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: native/windows-host/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify managed Mock protocol transports
        run: pnpm test:protocols:managed
      - run: node scripts/build-windows-host.mjs
      - run: pnpm test
      - run: pnpm packages:pack:check
      - name: Verify installed npm management runtime
        run: node scripts/verify-manager-package.mjs
      - run: docker build -t onebots-control-ci .
      - name: Verify blank Docker CLI and HTTP control service
        run: |
          docker run -d --name onebots-control-ci --mount type=volume,source=onebots-control-ci-data,target=/data onebots-control-ci
          docker exec -i --user 1000:1000 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
          docker restart onebots-control-ci
          docker exec -i --user 1000:1000 -e CONTROL_VERIFY_RESTART=1 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
      - name: Verify ICQQ private peer installation through public CLI
        env:
          GH_PKG_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
        run: |
          test -n "$GH_PKG_TOKEN"
          docker cp scripts/verify-private-installation-cli.mjs onebots-control-ci:/tmp/verify-private-installation-cli.mjs
          printf '%s' "$GH_PKG_TOKEN" | docker exec -i --user 1000:1000 onebots-control-ci node /tmp/verify-private-installation-cli.mjs
          docker logs onebots-control-ci 2>&1 | node -e '
            const chunks = [];
            process.stdin.on("data", chunk => chunks.push(chunk));
            process.stdin.on("end", () => {
              if (Buffer.concat(chunks).includes(Buffer.from(process.env.GH_PKG_TOKEN))) {
                console.error("ICQQ 下载凭据出现在容器日志中");
                process.exit(1);
              }
            });
          '
          docker rm -f onebots-control-ci
          docker volume rm onebots-control-ci-data
          docker run -d --name onebots-control-ci --mount type=volume,source=onebots-control-ci-data,target=/data onebots-control-ci
      - name: Verify dependency generation and protocol API
        run: docker exec -i --user 1000:1000 onebots-control-ci node --input-type=module < scripts/verify-control-installation.mjs
      - name: Verify damaged configuration repair
        run: docker exec -i --user 1000:1000 -e CONTROL_VERIFY_REPAIR=disposable-ci-volume onebots-control-ci node --input-type=module < scripts/verify-control-repair.mjs
      - name: Verify HF management and deployment pairing
        run: |
          docker build --build-arg ONEBOTS_BASE_IMAGE=onebots-control-ci -f Dockerfile.hf -t onebots-hf-ci .
          node scripts/verify-hf-container.mjs onebots-hf-ci
      - name: Clean verification container
        if: always()
        run: |
          docker rm -f onebots-control-ci || true
          docker volume rm onebots-control-ci-data || true
