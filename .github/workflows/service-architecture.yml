name: Service architecture validation

on:
  push:
    branches: [codex/service-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm packages:pack:check
      - run: docker build -t onebots-control-ci .
      - name: Verify blank Docker control service
        run: |
          docker run -d --name onebots-control-ci --mount type=volume,source=onebots-control-ci-data,target=/data onebots-control-ci
          docker exec -i --user 1000:1000 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
          docker restart onebots-control-ci
          docker exec -i --user 1000:1000 -e CONTROL_VERIFY_RESTART=1 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
      - name: Verify dependency generation and protocol API
        run: docker exec -i --user 1000:1000 onebots-control-ci node --input-type=module < scripts/verify-control-installation.mjs
      - name: Verify damaged configuration repair
        run: docker exec -i --user 1000:1000 -e CONTROL_VERIFY_REPAIR=disposable-ci-volume onebots-control-ci node --input-type=module < scripts/verify-control-repair.mjs
      - name: Verify HF management and deployment pairing
        run: |
          docker build --build-arg ONEBOTS_BASE_IMAGE=onebots-control-ci -f Dockerfile.hf -t onebots-hf-ci .
          node scripts/verify-hf-container.mjs onebots-hf-ci
      - name: Clean verification container
        if: always()
        run: |
          docker rm -f onebots-control-ci || true
          docker volume rm onebots-control-ci-data || true
