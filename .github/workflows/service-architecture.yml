name: Service architecture validation

on:
  push:
    branches: [codex/service-architecture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run packages/onebots/src __tests__/unit/docker*
      - run: pnpm packages:pack:check
      - run: docker build -t onebots-control-ci .
      - name: Verify blank Docker control service
        run: |
          docker run -d --name onebots-control-ci onebots-control-ci
          docker exec -i --user 1000:1000 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
          docker restart onebots-control-ci
          docker exec -i --user 1000:1000 -e CONTROL_VERIFY_RESTART=1 onebots-control-ci node --input-type=module < scripts/verify-control-container.mjs
      - name: Clean verification container
        if: always()
        run: docker rm -f onebots-control-ci || true
