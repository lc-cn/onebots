port: 6727 # 监听端口
log_level: info # 日志等级
timeout: 30 # 登录超时时间（秒）

# username / password 不配置时，首次启动会自动生成并写入本文件。
# 请从启动日志取得初始凭据，登录 Web 管理端后立即修改。

# 协议默认值。账号未单独覆写时使用这里的配置。
general:
    onebot.v11:
        use_http: true
        use_ws: true
        access_token: ""
        secret: ""
        enable_cors: true
        heartbeat_interval: 5

# 默认样例不创建平台账号，确保首次启动不会使用空凭据连接外部平台。
# 登录 Web 管理端后可在「配置管理」中添加账号；也可以参考下方格式手动配置。
#
# qq.my_bot:
#     appid: "your_app_id"
#     secret: "your_secret"
#     mode: websocket
#     onebot.v11:
#         access_token: "replace_with_a_strong_token"
#
# 账号键格式为 {platform}.{account_id}。可用平台字段和协议配置见：
# https://onebots.pages.dev/guide/adapter
