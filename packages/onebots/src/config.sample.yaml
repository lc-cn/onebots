port: 6727 # 监听端口
log_level: info # 日志等级
timeout: 30 # 登录超时时间（秒）

# access_token 或完整的 username / password 均未配置时，首次启动会生成
# 256 位 access_token 并写入本文件，但不会把鉴权码输出到服务日志。

# 协议默认值。初始保持为空，避免引用启动命令没有加载的协议。
# 添加账号时可在 Web 管理端按已加载协议生成配置。
general: {}

# 默认样例不创建平台账号，确保首次启动不会使用空凭据连接外部平台。
# 登录 Web 管理端后可在「配置管理」中添加账号；也可以参考下方格式手动配置。
#
# qq.my_bot:
#     appid: "your_app_id"
#     secret: "your_secret"
#     mode: websocket
#     onebot.v11:
#         access_token: "replace_with_a_strong_token"
#
# 账号键格式为 {platform}.{account_id}。可用平台字段和协议配置见：
# https://onebots.pages.dev/guide/adapter
