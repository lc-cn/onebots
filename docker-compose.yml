# OneBots 网关 - Docker Compose（使用官方镜像，无需本地构建）
# 使用：docker compose up -d；空卷直接提供管理端，首次通过本机命令签发配对码。
# 私有扩展：通过管理端安装，下载授权仅用于本次安装。
# 下载 Token 只交给一次性安装器，禁止给本服务挂载 npmrc 或 Docker socket。
#
# 必须挂载 ./data 到 /data，以持久化用户配置（config.yaml）与数据库，否则重启后配置会丢失

services:
  onebots:
    image: ghcr.io/lc-cn/onebots:master
    container_name: onebots
    restart: unless-stopped
    ports:
      - "6727:6727"
    volumes:
      # 持久化用户配置 config.yaml 与数据（SQLite、日志等）
      - ./data:/data
    environment:
      - NODE_ENV=production
      # 可选的一次性部署配对码；未设置时使用本机 auth bootstrap
      - ONEBOTS_BOOTSTRAP_CODE
    healthcheck:
      test: ["CMD", "node", "/app/scripts/docker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
